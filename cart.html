<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabKeep Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8fc;
      color: #14294c;
    }

    .cart-header {
  background:
    radial-gradient(circle at 15% 20%, rgba(80, 210, 255, 0.35), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(0, 190, 255, 0.28), transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(0, 120, 220, 0.45), transparent 40%),
    linear-gradient(135deg, #0066b3, #004b93 45%, #003b7a);
  color: white;
  padding: 40px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

    .cart-header::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(125deg, transparent 20%, rgba(255,255,255,0.16) 21%, transparent 23%),
    linear-gradient(145deg, transparent 55%, rgba(255,255,255,0.12) 56%, transparent 58%),
    radial-gradient(circle at 25% 70%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 20%, rgba(255,255,255,0.2) 0 2px, transparent 3px),
    radial-gradient(circle at 90% 75%, rgba(255,255,255,0.16) 0 3px, transparent 4px);
  pointer-events: none;
}

.cart-header h1,
.cart-header p {
  position: relative;
  z-index: 1;
}

    .cart-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .cart-header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .cart-container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .cart-item {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .cart-item h3 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #14294c;
    }

    .cart-item p {
      margin: 5px 0;
      font-size: 14px;
      color: #555;
    }

    .cart-price {
      font-weight: bold;
      color: #1237d8;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }

    .quantity-controls button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: #1237d8;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity {
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }

    .remove-button {
      margin-top: 12px;
      border: none;
      background: transparent;
      color: #d93025;
      cursor: pointer;
      font-size: 13px;
    }

    .cart-summary {
      background: white;
      border-radius: 10px;
      padding: 22px;
      margin-top: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .cart-button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .continue-shopping {
      background: #eef2ff;
      color: #1237d8;
    }

    .whatsapp-button {
      background: #25D366;
      color: white;
    }

    .empty-cart {
      background: white;
      padding: 40px 20px;
      border-radius: 10px;
      text-align: center;
    }

    .empty-cart h2 {
      margin-top: 0;
    }

    @media (max-width: 600px) {

      .cart-header h1 {
        font-size: 24px;
      }

      .cart-container {
        width: 94%;
      }

      .total-row {
        font-size: 18px;
      }

    }

    /* =================================
   LABKEEP ORDER CONFIRMATION POPUP
================================= */

.order-confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100001;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(9, 20, 55, 0.68);
  backdrop-filter: blur(4px);
}

.order-confirm-overlay.active {
  display: flex;
}

.order-confirm-box {
  position: relative;
  width: 100%;
  max-width: 430px;
  padding: 30px 25px;
  border-radius: 18px;
  background: #ffffff;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.order-confirm-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #eef2ff;
  color: #1237d8;
  font-size: 28px;
}

.order-confirm-box h2 {
  margin: 0 0 12px;
  color: #0b1f5c;
  font-size: 22px;
}

.order-confirm-box p {
  margin: 0 0 22px;
  color: #626b7d;
  font-size: 14px;
  line-height: 1.7;
}

.order-confirm-actions {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.order-confirm-actions button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.order-confirm-sent {
  background: #0d2154;
  color: #ffffff;
}

.order-confirm-not-sent {
  background: #eef2ff;
  color: #1237d8;
}

@media (max-width: 600px) {
  .order-confirm-box {
    padding: 27px 21px;
  }
}
  </style>
</head>

<body>

  <div class="cart-header">
    <h1>LabKeep Cart</h1>
    <p>Review your selected laboratory products</p>
  </div>

  <main class="cart-container">

    <div id="cartItems"></div>

    <div id="cartSummary" class="cart-summary">

      <div class="total-row">
        <span>Total</span>
        <span id="cartTotal">₦0</span>
      </div>

      <button
        class="cart-button continue-shopping"
        onclick="window.history.back()">
        Continue Shopping
      </button>

      <button
        class="cart-button whatsapp-button"
        onclick="sendCartToWhatsApp()">
        Send Order via WhatsApp
      </button>

    </div>

  </main>

  <!-- LABKEEP ORDER CONFIRMATION POPUP -->

<div id="orderConfirmPopup" class="order-confirm-overlay">

  <div class="order-confirm-box">

    <div class="order-confirm-icon">✓</div>

    <h2>Did you send your order?</h2>

    <p>
      Please confirm whether you successfully sent your
      order message to LabKeep on WhatsApp.
    </p>

    <div class="order-confirm-actions">

      <button
        type="button"
        class="order-confirm-sent"
        onclick="confirmOrderSent()">
        I've Sent My Order
      </button>

      <button
        type="button"
        class="order-confirm-not-sent"
        onclick="cancelOrderConfirmation()">
        I Haven't Sent It Yet
      </button>

    </div>

  </div>

</div>

  <script>

    const whatsappNumber = "2347078986387";

    let cart =
      JSON.parse(localStorage.getItem("labkeepCart")) || [];

    function formatPrice(number) {
      return "₦" + Number(number).toLocaleString("en-NG");
    }

    function saveCart() {
      localStorage.setItem(
        "labkeepCart",
        JSON.stringify(cart)
      );
    }

    function displayCart() {

      const cartItems =
        document.getElementById("cartItems");

      const cartTotal =
        document.getElementById("cartTotal");

      if (cart.length === 0) {

        cartItems.innerHTML = `
          <div class="empty-cart">
            <h2>Your cart is empty</h2>
            <p>Add laboratory products to your cart to see them here.</p>
          </div>
        `;

        cartTotal.textContent = "₦0";

        return;
      }

      let total = 0;

      cartItems.innerHTML = "";

      cart.forEach(function (item, index) {

        const subtotal =
          item.price * item.quantity;

        total += subtotal;

        const itemHTML = `
          <div class="cart-item">

            <h3>${item.name}</h3>

            <p>
              Supplier: ${item.supplier}
            </p>

            <p>
              Location: ${item.location}
            </p>

            <p class="cart-price">
              ${item.priceDisplay}
            </p>

            <div class="quantity-controls">

              <button onclick="decreaseQuantity(${index})">
                −
              </button>

              <span class="quantity">
                ${item.quantity}
              </span>

              <button onclick="increaseQuantity(${index})">
                +
              </button>

            </div>

            <p>
              Subtotal:
              <strong>
                ${formatPrice(subtotal)}
              </strong>
            </p>

            <button
              class="remove-button"
              onclick="removeItem(${index})">
              Remove
            </button>

          </div>
        `;

        cartItems.innerHTML += itemHTML;

      });

      cartTotal.textContent =
        formatPrice(total);

    }

    function increaseQuantity(index) {

      cart[index].quantity += 1;

      saveCart();
      displayCart();

    }

    function decreaseQuantity(index) {

      if (cart[index].quantity > 1) {

        cart[index].quantity -= 1;

      } else {

        cart.splice(index, 1);

      }

      saveCart();
      displayCart();

    }

    function removeItem(index) {

      cart.splice(index, 1);

      saveCart();
      displayCart();

    }

    function sendCartToWhatsApp() {

  if (cart.length === 0) {

    alert("Your cart is empty.");
    return;

  }

  let message =
    "Hello LabKeep, I would like to order the following products:\n\n";

  let total = 0;

  cart.forEach(function (item, index) {

    const subtotal = item.price * item.quantity;

    total += subtotal;

    message +=
      (index + 1) + ". " +
      item.name +
      " - " +
      item.priceDisplay +
      " x " +
      item.quantity +
      " = " +
      formatPrice(subtotal) +
      "\n";

  });

  message +=
    "\nTotal: " +
    formatPrice(total) +
    "\n\nPlease confirm availability and delivery details.";

  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  // Remember that the customer is leaving to WhatsApp
  sessionStorage.setItem(
    "labkeepPendingOrderConfirmation",
    "yes"
  );

  window.open(whatsappURL, "_blank");

}

    function showOrderConfirmation() {

  const pending =
    sessionStorage.getItem("labkeepPendingOrderConfirmation");

  if (pending !== "yes") return;

  const popup =
    document.getElementById("orderConfirmPopup");

  if (popup) {
    popup.classList.add("active");
  }

}


// Customer confirms that they sent the WhatsApp order
function confirmOrderSent() {

  cart = [];

  saveCart();
  displayCart();

  sessionStorage.removeItem(
    "labkeepPendingOrderConfirmation"
  );

  document
    .getElementById("orderConfirmPopup")
    .classList.remove("active");

}


// Customer has not sent the message
function cancelOrderConfirmation() {

  sessionStorage.removeItem(
    "labkeepPendingOrderConfirmation"
  );

  document
    .getElementById("orderConfirmPopup")
    .classList.remove("active");

}


// Detect when the customer returns to LabKeep
document.addEventListener("visibilitychange", function () {

  if (document.visibilityState === "visible") {
    showOrderConfirmation();
  }

});

window.addEventListener("focus", showOrderConfirmation);

window.addEventListener("pageshow", showOrderConfirmation);


displayCart();

</script>

</body>
</html>
